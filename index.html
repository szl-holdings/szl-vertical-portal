<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SZL Holdings - Verticals Portal</title>
<meta name="description" content="All-estate vertical front door: 78 HF Spaces, 186 repos, one measured, fail-closed index.">
<style>
:root{--bg:#07090f;--glass:rgba(16,22,36,.55);--edge:rgba(140,160,220,.16);--txt:#dfe6f4;--dim:#8b95ad;--acc:#6ee7c8;--warn:#f0b34d;--bad:#e5687b}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt)}
canvas#holo{position:fixed;inset:0;z-index:0;opacity:.5;pointer-events:none}
#decorTag{position:fixed;left:10px;bottom:10px;z-index:2;font-size:10px;letter-spacing:.08em;color:#6b7489;border:1px solid var(--edge);padding:3px 9px;border-radius:6px;background:rgba(7,9,15,.55);backdrop-filter:blur(8px)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 20px 80px}
header h1{margin:0;font-size:30px;letter-spacing:.5px}
header p{color:var(--dim);margin:.35em 0 0}
.honesty{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.pill{border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(10px);padding:5px 12px;border-radius:999px;font-size:12px;color:var(--acc)}
.gate{margin:14px 0;padding:10px 14px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(10px);border-radius:12px;font-size:13px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:18px}
.card{border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(14px);border-radius:16px;padding:16px 16px 12px}
.card:hover{border-color:rgba(110,231,200,.45)}
.card h2{margin:0;font-size:17px;display:flex;gap:8px;align-items:center}
.tier{font-size:10px;border:1px solid var(--edge);padding:1px 7px;border-radius:999px;color:var(--warn)}
.meta{color:var(--dim);font-size:12px;margin:6px 0 4px}
.tech{font-size:12.5px;color:#aebadb;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--edge);background:rgba(10,14,24,.5);padding:3px 9px;border-radius:8px;font-size:12px;color:var(--txt);text-decoration:none}
.chip:hover{border-color:var(--acc)}
.chip small{color:var(--dim)}
.stageRUNNING{color:var(--acc)}
.stageUNKNOWN,.stagePROBE_FAIL{color:var(--warn)}
.stagePAUSED,.stageBUILDING{color:var(--bad)}
footer{margin-top:44px;color:var(--dim);font-size:12px;border-top:1px solid var(--edge);padding-top:14px}
a{color:var(--acc)}
</style>
</head>
<body>
<canvas id="holo" aria-hidden="true"></canvas>
<div id="decorTag">AMBIENT SCENE - DECORATIVE, NOT DATA</div>
<div class="wrap">
<header><h1>SZL Holdings - Verticals Portal</h1><p id="sub">loading measured census...</p></header>
<div class="honesty" id="honesty"></div>
<div class="gate" id="stageNote"></div>
<div class="gate">3D panel policy: real live data only, from receipt/mesh APIs. No source wired = <b>UNAVAILABLE</b>, never invented. The ambient wireframe below is decorative, not data.</div>
<div class="grid" id="grid"></div>
<footer id="foot"></footer>
</div>
<script src="data.js"></script>
<script>
(function(){
var D=window.PORTAL_DATA;if(!D){return;}
document.getElementById('sub').textContent=D.counts.spaces+' HF Spaces / '+D.counts.models+' models / '+D.counts.datasets+' datasets / '+D.counts.repos+' repos - census '+D.generated;
var h=document.getElementById('honesty');D.honesty.forEach(function(p){var s=document.createElement('span');s.className='pill';s.textContent=p;h.appendChild(s);});
document.getElementById('stageNote').innerHTML='Stage labels are <b>build-time snapshots</b>. '+D.stage_note;
var g=document.getElementById('grid');
D.verticals.forEach(function(v){
 var c=document.createElement('div');c.className='card';
 var chips=v.spaces.map(function(s){var st='stage'+(s.stage||'UNKNOWN');return '<a class="chip" href="'+s.url+'" target="_blank" rel="noopener">['+st+'] '+s.id+(s.owner_note?' / '+s.owner_note:'')+'</a>';}).join('');
 var tech='<div class="tech">3D next: '+v.tech+'</div><div class="tech">live source: '+v.source+'</div>';
 c.innerHTML='<h2>'+v.name+' <span class="tier">'+v.tier+'</span></h2><div class="meta">'+v.spaces.length+' spaces / '+v.repo_count+' repos / '+v.model_count+' models / '+v.dataset_count+' datasets (keyword-tagged)</div>'+tech+'<div class="chips">'+chips+'</div>';
 g.appendChild(c);
});
document.getElementById('foot').innerHTML='Receipts: census GET-only at build / runtime probes at build / panel seats on device / honesty gates: UNAVAILABLE over invented, MEASURED over claimed.';
})();
</script>
<script defer src="vendor/three.min.js" onload="szlAmbient()"></script>
<script>
function szlAmbient(){
 var dt=document.getElementById('decorTag');
 if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){if(dt){dt.textContent='AMBIENT SCENE OFF - REDUCED MOTION';}return;}
 try{
  var cv=document.getElementById('holo');var r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});r.setPixelRatio(Math.min(window.devicePixelRatio,2));
  var sc=new THREE.Scene();var cam=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,.1,100);cam.position.z=6;
  var m=new THREE.Mesh(new THREE.IcosahedronGeometry(2.4,1),new THREE.MeshBasicMaterial({color:0x6ee7c8,wireframe:true,transparent:true,opacity:.28}));sc.add(m);
  var m2=new THREE.Mesh(new THREE.IcosahedronGeometry(3.4,0),new THREE.MeshBasicMaterial({color:0x8ca0dc,wireframe:true,transparent:true,opacity:.10}));sc.add(m2);
  function rs(){r.setSize(window.innerWidth,window.innerHeight);cam.aspect=window.innerWidth/window.innerHeight;cam.updateProjectionMatrix();}
  window.addEventListener('resize',rs);rs();
  var t0=Date.now();
  (function loop(){requestAnimationFrame(loop);var t=Date.now()-t0;m.rotation.y=t*.00012;m.rotation.x=t*.00005;m2.rotation.y=-t*.00008;if(window.scrollY<window.innerHeight*2){r.render(sc,cam);}})();
 }catch(e){}
}
</script>
</body></html>
