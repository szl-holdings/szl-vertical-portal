name: portal-validate
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python validators/validate.py
